# Production Profile Configuration
spring:
  config:
    activate:
      on-profile: prod
  
  # Database - PostgreSQL for production (Docker)
  datasource:
    url: jdbc:postgresql://localhost:5432/tellinbox_db
    driver-class-name: org.postgresql.Driver
    username: admin
    password: admin
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false
  
  # Liquibase for database migrations
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    contexts: production
  
  # Jackson for JSON processing
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Logging - Production settings
logging:
  level:
    root: INFO
    com.tellinbox: INFO
    org.hibernate.SQL: OFF
    org.springframework.security: WARN

# MinIO - Local Docker endpoint
minio:
  url: http://localhost:9000
  bucket: tellinbox
  access-key: admin
  secret-key: adminadmin

# JWT - Production settings
jwt:
  secret: "T3ll1nb0x-S3cur3-K3y-2024-Pr0duct10n-JWT-S3cr3t-K3y-F4rs1-L0c4l-D0ck3r"
  expiration-ms: 3600000 # 1 hour
  refresh-expiration-ms: 86400000 # 24 hours
  issuer: tellinbox
  audience: tellinbox-app

# Server settings
server:
  port: 8080
  servlet:
    context-path: /api
    application-display-name: tellinbox
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,application/json,application/javascript
    min-response-size: 1024
